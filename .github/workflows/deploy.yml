name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.repository == 'developers704/Smart-Routine'

    steps:
      - name: Deploy on Hetzner VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev 2>/dev/null || npm install --omit=dev
            if [ -n "${{ secrets.VPS_RESTART_CMD }}" ]; then
              ${{ secrets.VPS_RESTART_CMD }}
            elif command -v pm2 >/dev/null 2>&1; then
              pm2 restart routine-ai || pm2 restart smartroutine || pm2 restart routine || pm2 restart all
            elif systemctl is-active --quiet smartroutine 2>/dev/null; then
              sudo systemctl restart smartroutine
            else
              echo "Set VPS_RESTART_CMD secret (e.g. pm2 restart routine-ai)"
              exit 1
            fi
            echo "Deploy finished."
